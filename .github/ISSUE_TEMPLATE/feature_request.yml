name: Feature request
description: Suggest something the plugin should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you're in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like it to do
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: Does the UniFi API expose this?
      description: |
        Optional, but it moves things along. Reads and writes both use the
        console's `/proxy/network/api/s/<site>/…` surface. If you know the
        endpoint, name it.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This works against a local console, without any Ubiquiti cloud account
