version: 2
updates:
  # The plugin itself has no package dependencies - the poller is stdlib-only
  # Python and the QML imports ship with Omarchy. Only CI actions need watching.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    # Paused while the marketplace submission is under review. Approval is bound
    # to an exact commit SHA, so an actions bump landing mid-review invalidates
    # the validated snapshot. Restore this to the default limit once listed.
    open-pull-requests-limit: 0
